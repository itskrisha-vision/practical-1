<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#ffffff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:450px;
            border:1px solid #ccc;
            border-radius:8px;
            padding:25px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        .profile{
            display:block;
            width:120px;
            height:120px;
            margin:0 auto 20px;
            border-radius:50%;
            border:2px solid #000;
            object-fit:cover;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            height:35px;
            margin-top:5px;
            margin-bottom:15px;
            padding:8px;
            border:1px solid #999;
            border-radius:5px;
        }

        .row{
            display:flex;
            gap:15px;
        }

        .column{
            flex:1;
        }

        button{
            width:100%;
            height:40px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Profile</h1>

    <img src="adminLogo.jpeg" alt="Admin Profile" class="profile">

    <form action="dashboard.html">

        <div class="row">
            <div class="column">
                <label>First Name</label>
                <input type="text" placeholder="Enter First Name">
            </div>

            <div class="column">
                <label>Last Name</label>
                <input type="text" placeholder="Enter Last Name">
            </div>
        </div>

        <div class="row">
            <div class="column">
                <label>Email</label>
                <input type="email" placeholder="Enter Email">
            </div>

            <div class="column">
                <label>Password</label>
                <input type="password" placeholder="Enter Password">
            </div>
        </div>

        <label>Phone Number</label>
        <input type="text" placeholder="Enter Phone Number">

        <label>Admin ID</label>
        <input type="text" placeholder="Enter Admin ID">

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
