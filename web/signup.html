<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
height:100vh;
}

.left{
width:25%;
border-right:2px solid black;
display:flex;
justify-content:center;
align-items:center;
}

.menu{
display:flex;
flex-direction:column;
}

.menu a{
text-decoration:none;
color:black;
border:2px solid black;
padding:12px 45px;
text-align:center;
margin:5px;
border-radius:8px;
}

.right{
width:75%;
display:flex;
justify-content:center;
align-items:center;
}

.form{
width:420px;
}

h1{
text-align:center;
margin-bottom:50px;
font-size:45px;
}

input{
width:100%;
border:none;
border-bottom:2px solid black;
padding:12px;
margin:20px 0;
font-size:18px;
outline:none;
}

button{
margin-top:25px;
width:100%;
padding:14px;
font-size:20px;
border:2px solid black;
background:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="left">

<div class="menu">

<a href="login.html">Login</a>

<a href="signup.html">Sign Up</a>

</div>

</div>

<div class="right">

<div class="form">

<h1>Create An Account</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button><a href="dashboard.html">Get Started</a></button>

</div>

</div>

</body>
</html>
