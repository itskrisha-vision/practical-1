<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:500px;
            border:1px solid #ccc;
            border-radius:8px;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #999;
            border-radius:5px;
            font-size:15px;
        }

        textarea{
            height:120px;
            resize:none;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
            margin-top:10px;
        }

        button{
            width:48%;
            height:40px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Feedback</h1>

    <form action="dashboard.html">

        <label>Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Feedback</label>
        <textarea placeholder="Write your feedback here..." required></textarea>

        <div class="buttons">
            <button type="submit">Submit</button>

            <button type="button"
            onclick="window.location.href='dashboard.html'">
                Back
            </button>
        </div>

    </form>

</div>

</body>
</html>
