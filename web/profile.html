<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#74ebd5,#9face6);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#2c3e50;
            margin-bottom:15px;
        }

        img{
            display:block;
            margin:auto;
            width:120px;
            height:120px;
            border-radius:50%;
            border:4px solid #4CAF50;
            margin-bottom:10px;
        }

        h3{
            text-align:center;
            margin-bottom:20px;
            color:#555;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"]{
            width:100%;
            height:40px;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus{
            border-color:#4CAF50;
            box-shadow:0 0 5px rgba(76,175,80,.5);
        }

        .gender{
            display:flex;
            align-items:center;
            gap:25px;
            margin-top:8px;
            margin-bottom:18px;
        }

        .gender label{
            font-weight:normal;
        }

        button{
            width:100%;
            height:45px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2e7d32;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Student Profile</h1>

<img src="student.jpeg" alt="Student">

<h3>Student Name</h3>

<form action="dashboard.html">

<label>Student ID</label>
<input type="text" placeholder="Enter Student ID">

<label>Name</label>
<input type="text" placeholder="Enter Name">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Phone Number</label>
<input type="text" placeholder="Enter Phone Number">

<label>Course</label>
<input type="text" placeholder="Computer Engineering">

<label>Semester</label>
<input type="text" placeholder="Semester">

<label>Enrollment Number</label>
<input type="text" placeholder="Enter Enrollment Number">

<label>Date of Birth</label>
<input type="date">

<label>Gender</label>

<div class="gender">
    <label>
        <input type="radio" name="gender"> Male
    </label>

    <label>
        <input type="radio" name="gender"> Female
    </label>

    <label>
        <input type="radio" name="gender"> Other
    </label>
</div>

<label>Address</label>
<input type="text" placeholder="Enter Address">

<label>Parent Name</label>
<input type="text" placeholder="Enter Parent Name">

<label>Blood Group</label>
<input type="text" placeholder="Enter Blood Group">

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
